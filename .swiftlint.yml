included:
  - app/Sources
  - app/Tests

excluded:
  - app/.build
  - app/Sealshot.xcodeproj
  - poc

opt_in_rules:
  - empty_count
  - first_where
  - sorted_first_last
  - contains_over_first_not_nil
  - closure_spacing
  - explicit_init
  - redundant_nil_coalescing
  - operator_usage_whitespace

line_length:
  warning: 140
  error: 200

function_body_length:
  warning: 80
  error: 150

type_body_length:
  warning: 300
  error: 500

identifier_name:
  min_length: 2
  excluded:
    - id
    - x
    - y
